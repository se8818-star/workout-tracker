<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chunky Training</title>
  <meta name="description" content="Coach-built programs and athlete workout logging">
  <meta name="theme-color" content="#f3f3f0">
  <script>
    // Dark or Match my phone, picked on the More page; set before the page draws so it doesn't flash.
    try { const t = localStorage.getItem('wt-theme'); if (t === 'auto' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    // Start opening saved data now, while the app's files download (js/store.js picks it up).
    window.wtDisk = new Promise(function (resolve) {
      try {
        var req = indexedDB.open('chunky-training', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('parts'); };
        req.onerror = req.onblocked = function () { resolve(null); };
        req.onsuccess = function () {
          var conn = req.result, os = conn.transaction('parts').objectStore('parts');
          var keys = os.getAllKeys(), vals = os.getAll();
          vals.onsuccess = function () { resolve({ conn: conn, entries: keys.result.map(function (k, i) { return [k, vals.result[i]]; }) }); };
          vals.onerror = function () { resolve({ conn: conn, entries: null }); };
        };
      } catch (e) { resolve(null); }
    });
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chunky">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@75..100,700..800&family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="wrap"></main>
  <nav id="nav" class="tabbar" aria-label="Main" hidden></nav>
  <noscript>This app needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
